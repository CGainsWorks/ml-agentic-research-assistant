[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "araa"
version = "0.1.0"
description = "Agentic research assistant: hybrid retrieval, reranking, LangGraph agent, citation grounding, injection guardrails"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  # graph + orchestration
  "langgraph==0.2.62",
  "langchain-core==0.3.29",

  # retrieval
  "chromadb==0.5.23",
  "sentence-transformers==3.3.1",
  "torch==2.5.1",
  "rank-bm25==0.2.2",

  # ingestion
  "pymupdf==1.25.1",
  "pandas==2.2.3",
  "pyarrow==18.1.0",

  # service
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sse-starlette==2.2.1",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",

  # scheduling
  "apscheduler==3.11.0",

  # config / io
  "pyyaml==6.0.2",
  "python-dotenv==1.0.1",
  "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4",
]

[project.scripts]
araa = "araa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `pip install -e .` installs only `araa` (it lives under src/). `evals` is a
# top-level directory that is deliberately not a distributed package, and
# several tests import from it.
#
# `python -m pytest` puts the CWD on sys.path and hides this; bare `pytest`
# does not. CI runs bare `pytest`, so it failed at collection with
# "No module named 'evals'" while every local run passed. Setting pythonpath
# here fixes the repository rather than the invocation, so both work.
pythonpath = ["."]
